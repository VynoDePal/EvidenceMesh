name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --extra dev --locked --python 3.11
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run evidencemesh benchmark-offline
      - name: Audit locked runtime dependencies
        shell: bash
        run: |
          set -o pipefail
          uv export --frozen --no-dev --format requirements-txt --no-hashes |
            uvx pip-audit==2.10.1 -r /dev/stdin

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev --locked --python ${{ matrix.python-version }}
      - run: .venv/bin/python -m pytest --cov=evidencemesh --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
      - run: uv build
      - run: uvx twine==7.0.0 check dist/*

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
      - run: docker build --tag evidencemesh:ci .
      - run: docker run --rm evidencemesh:ci providers

  searxng-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --extra dev --locked --python 3.11
      - name: Start checksum-pinned SearXNG
        run: docker compose up --detach --wait --wait-timeout 180 searxng
      - name: Verify image digest
        run: |
          docker image inspect \
            "searxng/searxng:2026.7.26-b060c780d@sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516" \
            --format '{{json .RepoDigests}}' |
            grep --fixed-strings \
              "sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516"
      - name: Exercise the SearXNG adapter
        env:
          EVIDENCEMESH_PROVIDERS: searxng
          EVIDENCEMESH_SEARXNG_URL: http://127.0.0.1:8888
          EVIDENCEMESH_CACHE_PATH: /tmp/evidencemesh-searxng.sqlite3
        run: |
          uv run evidencemesh search \
            "SearXNG metasearch engine" \
            --limit 3 \
            --output json > /tmp/evidencemesh-searxng-smoke.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(
              Path("/tmp/evidencemesh-searxng-smoke.json").read_text(encoding="utf-8")
          )
          metadata = response["metadata"]
          expected = (
              metadata["providers_requested"] == ["searxng"]
              and metadata["providers_succeeded"] == ["searxng"]
              and metadata["provider_failures"] == {}
          )
          if not expected:
              raise AssertionError(json.dumps(metadata, indent=2, sort_keys=True))
          PY
      - name: Show SearXNG logs on failure
        if: failure()
        run: docker compose logs --no-color searxng
      - name: Stop SearXNG
        if: always()
        run: docker compose down --volumes
