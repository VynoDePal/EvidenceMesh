name: Phase 11.8.5 Gemini Live Smoke

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    paths:
      - .github/workflows/phase11-8-5-live-smoke.yml
      - benchmarks/data/phase11_8_5_live_smoke_v1.json
      - benchmarks/phase11_8_2_candidate.py
      - benchmarks/phase11_8_4_guardrails.py
      - benchmarks/run_phase11_8_5_live_smoke.py
      - benchmarks/results/phase11_8_3_factorial_2026-07-30.json
      - benchmarks/results/phase11_8_4_offline_guardrails_2026-07-30.json
      - benchmarks/results/phase11_8_5_live_smoke_2026-07-30.json
      - benchmarks/results/phase11_8_5_live_smoke_2026-07-30.md
      - docs/benchmark-protocol-v20.md
      - tests/test_phase11_8_5_live_smoke.py
  workflow_dispatch:
    inputs:
      authorize_live_run:
        description: Authorize at most 8 Gemini requests and no Tavily request
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: phase11-8-5-live-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  RESULT_PATH: /tmp/phase11_8_5_live_smoke_2026-07-30.json

jobs:
  lock-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify immutable sources
        run: |
          echo \
            "6c41f28afbf1ae4d4d6c2efaf83d54610dc6fdbc98256aeff7cacef90956b001  docs/benchmark-protocol-v20.md" \
            | sha256sum --check
          echo \
            "64096454a2884817148694b6086043a7fdbecb911b8db4456994a6dfadfc47af  benchmarks/data/phase11_8_5_live_smoke_v1.json" \
            | sha256sum --check
          echo \
            "83a4341b93c49b3fc8c6a7f46da40c24f8bed19b516472229e3b280a3ebc763d  benchmarks/phase11_8_4_guardrails.py" \
            | sha256sum --check
          echo \
            "480e60d9f1d9807d9f7d0e21b23f812dbed2a4c978d27b08a8b810fe719d000d  benchmarks/results/phase11_8_4_offline_guardrails_2026-07-30.json" \
            | sha256sum --check
          echo \
            "167a7eb531966ee0591a1ae01b2a8d9d47307cb1eb52ec152946bbe0dbc6e39c  benchmarks/results/phase11_8_3_factorial_2026-07-30.json" \
            | sha256sum --check
          echo \
            "0eb71a0e94b7e21d33105788d05076382f96ab9e5fd6cea9d16669305d38c74e  benchmarks/phase11_8_2_candidate.py" \
            | sha256sum --check

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked test environment
        run: |
          uv python install 3.11
          uv sync --extra dev --locked --python 3.11

      - name: Validate protocol without provider traffic
        run: |
          uv run python benchmarks/run_phase11_8_5_live_smoke.py --check-only

      - name: Run live-smoke unit and static checks
        run: |
          uv run pytest tests/test_phase11_8_5_live_smoke.py -q
          uv run ruff check \
            benchmarks/run_phase11_8_5_live_smoke.py \
            tests/test_phase11_8_5_live_smoke.py
          uv run ruff format --check \
            benchmarks/run_phase11_8_5_live_smoke.py \
            tests/test_phase11_8_5_live_smoke.py

  live-smoke:
    needs: lock-validation
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      inputs.authorize_live_run == true) ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'phase11.8.5-live-authorized' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Refuse to overwrite a committed result
        run: |
          if [[ -e benchmarks/results/phase11_8_5_live_smoke_2026-07-30.json ]]; then
            echo "::error::The Phase 11.8.5 JSON result is already committed"
            exit 1
          fi
          if [[ -e benchmarks/results/phase11_8_5_live_smoke_2026-07-30.md ]]; then
            echo "::error::The Phase 11.8.5 Markdown result is already committed"
            exit 1
          fi

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked smoke environment
        run: |
          uv python install 3.11
          uv sync --extra dev --locked --python 3.11

      - name: Revalidate frozen sources before live traffic
        run: |
          uv run python benchmarks/run_phase11_8_5_live_smoke.py --check-only

      - name: Verify Gemini credential is available
        env:
          GEMINI_API_KEY: ${{ secrets.EVIDENCE_MESH_GEMINI_KEY }}
        run: |
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::EVIDENCE_MESH_GEMINI_KEY is not configured"
            exit 1
          fi

      - name: Run locked eight-request Gemini micro-smoke
        env:
          EVIDENCEMESH_BENCHMARK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GEMINI_API_KEY: ${{ secrets.EVIDENCE_MESH_GEMINI_KEY }}
        run: |
          uv run python benchmarks/run_phase11_8_5_live_smoke.py \
            --model gemini-3.5-flash-lite \
            --repetitions 2 \
            --max-requests 8 \
            --cold-start-seconds 60 \
            --initial-daily-requests 392 \
            --max-output-tokens 256 \
            --thinking-level minimal \
            --request-timeout-seconds 30 \
            --wall-time-seconds 45 \
            --network-region "${EVIDENCEMESH_BENCHMARK_REGION:-GitHub-hosted runner}" \
            --output "$RESULT_PATH" \
            --progress

      - name: Validate privacy, traffic and decision boundaries
        env:
          GEMINI_API_KEY: ${{ secrets.EVIDENCE_MESH_GEMINI_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RESULT_PATH"]).read_bytes())
          assert report["benchmark"] == (
              "evidencemesh-phase11-8-5-gemini-live-smoke-v1"
          )
          assert report["suite"]["case_count"] == 4
          assert report["suite"]["repetitions"] == 2
          assert report["suite"]["maximum_attempts"] == 8
          assert report["suite"]["simpleqa_cases_used"] is False
          assert report["suite"]["phase11_7_cases_used"] is False
          assert report["suite"]["phase12_cases_used"] is False

          protocol = report["protocol"]
          assert protocol["model"] == "gemini-3.5-flash-lite"
          assert protocol["endpoint"] == "Gemini v1beta generateContent"
          assert protocol["response_mime_type"] == "application/json"
          assert protocol["max_output_tokens"] == 256
          assert protocol["thinking_level"] == "minimal"
          assert protocol["sampling_parameters"] == (
              "provider defaults; temperature/top-p/top-k omitted"
          )
          assert protocol["candidate_count"] == "omitted; provider default"
          assert protocol["cold_start_seconds"] == 60.0
          assert protocol["retry_policy"] == "none"

          traffic = report["traffic"]
          assert 1 <= traffic["gemini_requests"] <= 8
          assert traffic["maximum_gemini_requests"] == 8
          assert traffic["tavily_requests"] == 0
          assert traffic["other_provider_requests"] == 0
          assert traffic["token_count_requests"] == 0
          assert traffic["retries"] == 0
          assert traffic["fallback_requests"] == 0
          assert traffic["repair_requests"] == 0
          assert len(report["outcomes"]) == traffic["gemini_requests"]
          if report["aborted"]:
              assert report["aborted_reason"]
              assert report["decision"]["phase11_8_5_live_smoke_passed"] is False
          else:
              assert traffic["gemini_requests"] == 8

          assert len(report["decision"]["gates"]) == 12
          decision = report["decision"]
          assert decision["historical_phase11_8_3_result_changed"] is False
          assert decision["unchanged_phase11_8_3_rerun_authorized"] is False
          assert decision["phase11_9_protocol_may_be_frozen"] is False
          assert decision["phase12_authorized"] is False
          assert decision["phase12_executed"] is False
          assert decision["product_model_defaults_changed"] is False
          assert decision["merge_allowed"] is False
          assert decision["release_allowed"] is False
          assert decision["release_decision"] == "no-go"

          rendered = json.dumps(report, ensure_ascii=False, sort_keys=True)
          forbidden = (
              os.environ["GEMINI_API_KEY"],
              "According to the evidence, which city hosts",
              "The Solena Archive is located",
              "Naro City",
              "Project Amber began",
              "250 milliseconds",
              "A community orchard was planted",
              "x-goog-api-key",
              "PRIVATE_PROVIDER_MESSAGE",
              "quotaMetric",
              "quotaId",
          )
          assert all(value not in rendered for value in forbidden if value)
          PY

      - name: Prepare exact artifact inventory
        run: |
          artifact_dir=/tmp/phase11-8-5-artifact
          mkdir --parents "$artifact_dir"
          cp "$RESULT_PATH" \
            "$artifact_dir/phase11_8_5_live_smoke_2026-07-30.json"
          test "$(find "$artifact_dir" -maxdepth 1 -type f | wc -l)" -eq 1
          sha256sum "$artifact_dir/phase11_8_5_live_smoke_2026-07-30.json"

      - name: Upload privacy-safe result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase11-8-5-live-smoke-${{ github.run_id }}
          path: /tmp/phase11-8-5-artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
