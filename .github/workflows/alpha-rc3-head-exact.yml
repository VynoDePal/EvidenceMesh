name: Alpha RC3 HEAD Exact

on:
  push:
    branches:
      - agent/evidencemesh-v0.1

permissions:
  contents: read
  id-token: write
  attestations: write
  pull-requests: read

concurrency:
  group: alpha-rc3-head-exact-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.sha }}
  PROTOCOL_SHA256: 5363531629e09fd43b41e17b2f9ad4dc631d8548b308728471e6363c81198456
  RC_BUNDLE: /tmp/evidencemesh-alpha-rc3-head/evidencemesh-0.1.0-alpha-rc.3
  RC_NAME: evidencemesh-0.1.0-alpha-rc.3
  RC_ROOT: /tmp/evidencemesh-alpha-rc3-head
  RESULT_PATH: /tmp/evidencemesh-alpha-rc3-head-result.json
  RUNTIME_BASE_SHA: 710739311af1c11504e647e94026f13d3dfb221f
  RUNTIME_BASE_TREE: 70d75d4eddef8654e850215d9b3eb6abd778ecdf
  SOURCE_ROOT: /tmp/evidencemesh-alpha-rc3-head-source
  SOURCE_SUMS: /tmp/evidencemesh-alpha-rc3-head-source.SHA256SUMS
  UV_NO_CACHE: 1

jobs:
  accept-exact-head:
    if: >-
      github.repository == 'VynoDePal/EvidenceMesh' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/evidencemesh-v0.1' &&
      github.event.before == '710739311af1c11504e647e94026f13d3dfb221f' &&
      github.event.forced == false &&
      github.sha == github.event.after
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the exact self-attesting candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the one-shot identity and unchanged RC3 runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = "$RUNTIME_BASE_SHA"
          test "$(git rev-parse "$RUNTIME_BASE_SHA^{tree}")" = "$RUNTIME_BASE_TREE"
          test "$(git rev-list --parents --max-count=1 HEAD)" = \
            "$EXPECTED_SHA $RUNTIME_BASE_SHA"
          test -z "$(git status --porcelain)"
          expected_paths=$(printf '%s\n' \
            .github/workflows/alpha-rc3-head-exact.yml \
            docs/alpha-rc3-head-exact-protocol-v1.md \
            scripts/build_alpha_rc3_head_bundle.py \
            scripts/finalize_alpha_rc3_head_report.py \
            scripts/smoke_installed_rc3.py \
            tests/test_alpha_rc3_head_exact.py \
            | sort)
          actual_paths=$(git diff --name-only "$RUNTIME_BASE_SHA" HEAD | sort)
          test "$actual_paths" = "$expected_paths"
          git diff --quiet "$RUNTIME_BASE_SHA" HEAD -- \
            src/evidencemesh \
            pyproject.toml \
            uv.lock

      - name: Verify the PR remains the expected open draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          observed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/1" \
            --jq '[.state, (.draft | tostring), .head.ref, .head.sha] | @tsv')
          expected=$(printf 'open\ttrue\tagent/evidencemesh-v0.1\t%s' "$EXPECTED_SHA")
          test "$observed" = "$expected"

      - name: Set up pinned uv without an Actions cache
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Install locked supply-chain and validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          runner_uid=$(id -u)
          sudo install --directory \
            --owner="$runner_uid" \
            --group=nogroup \
            --mode=0700 \
            "$RC_ROOT"
          uv python install 3.11
          uv sync --extra dev --locked --python 3.11 --no-cache
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$RC_ROOT/runtime-requirements.txt"
          uv export \
            --frozen \
            --extra dev \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$RC_ROOT/build-requirements.txt"
          uv venv --python 3.11 "$RC_ROOT/wheel-installed"
          uv venv --python 3.11 "$RC_ROOT/sdist-installed"
          uv pip install \
            --python "$RC_ROOT/wheel-installed/bin/python" \
            --require-hashes \
            --requirement "$RC_ROOT/runtime-requirements.txt"
          uv pip install \
            --python "$RC_ROOT/sdist-installed/bin/python" \
            --require-hashes \
            --requirement "$RC_ROOT/runtime-requirements.txt"
          uv pip install \
            --python "$RC_ROOT/sdist-installed/bin/python" \
            --require-hashes \
            --requirement "$RC_ROOT/build-requirements.txt"

      - name: Audit the locked runtime dependency set
        shell: bash
        run: |
          set -euo pipefail
          uvx pip-audit==2.10.1 \
            --requirement "$RC_ROOT/runtime-requirements.txt"

      - name: Verify the frozen protocol
        shell: bash
        run: |
          set -euo pipefail
          echo "$PROTOCOL_SHA256  docs/alpha-rc3-head-exact-protocol-v1.md" \
            | sha256sum --check

      - name: Run every source gate with research networking disabled
        shell: bash
        run: |
          set -euo pipefail
          runner_uid=$(id -u)
          isolated_root="$RC_ROOT/isolated"
          install --directory --mode=0700 "$isolated_root"
          python_path="$PWD/.venv/bin/python"
          run_isolated=(
            sudo env -i
            HOME="$isolated_root"
            TMPDIR="$isolated_root"
            PATH=/usr/bin:/bin
            PYTHONDONTWRITEBYTECODE=1
            RUFF_CACHE_DIR="$isolated_root/ruff-cache"
            MYPY_CACHE_DIR="$isolated_root/mypy-cache"
            COVERAGE_FILE="$isolated_root/.coverage"
            UV_NO_CACHE=1
            /usr/bin/unshare --net --
            /usr/bin/setpriv
            --reuid="$runner_uid"
            --regid=nogroup
            --clear-groups
            --no-new-privs
          )
          "${run_isolated[@]}" /usr/bin/test ! -w /var/run/docker.sock
          "${run_isolated[@]}" "$python_path" -m ruff format --check .
          "${run_isolated[@]}" "$python_path" -m ruff check .
          "${run_isolated[@]}" "$python_path" -m mypy src
          "${run_isolated[@]}" "$python_path" -m pytest \
            --cov=evidencemesh \
            --cov-report=term-missing \
            -p no:cacheprovider \
            -q

      - name: Materialize the exact candidate as a read-only source tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff-index --quiet "$EXPECTED_SHA" --
          test ! -e "$SOURCE_ROOT"
          test ! -e "$SOURCE_SUMS"
          install --directory --mode=0700 "$SOURCE_ROOT"
          git archive --format=tar "$EXPECTED_SHA" \
            | tar --extract --directory "$SOURCE_ROOT"
          test -z "$(find "$SOURCE_ROOT" -type l -print -quit)"
          cd "$SOURCE_ROOT"
          find . -type f -print0 \
            | sort --zero-terminated \
            | xargs --null sha256sum \
            > "$SOURCE_SUMS"
          sudo chown --recursive root:root "$SOURCE_ROOT"
          sudo chown root:root "$SOURCE_SUMS"
          sudo chmod 0555 "$SOURCE_ROOT"
          sudo chmod 0444 "$SOURCE_SUMS"
          test -z "$(find "$SOURCE_ROOT" -mindepth 1 -perm /022 -print -quit)"
          test ! -w "$SOURCE_ROOT"
          test ! -w "$SOURCE_SUMS"

      - name: Build reproducible wheel and source distribution offline
        shell: bash
        run: |
          set -euo pipefail
          runner_uid=$(id -u)
          isolated_root="$RC_ROOT/isolated"
          source_date_epoch=$(git -C "$GITHUB_WORKSPACE" show \
            --no-patch --format=%ct "$EXPECTED_SHA")
          python_path="$GITHUB_WORKSPACE/.venv/bin/python"
          run_isolated=(
            sudo env -i
            HOME="$isolated_root"
            TMPDIR="$isolated_root"
            PATH=/usr/bin:/bin
            PYTHONDONTWRITEBYTECODE=1
            SOURCE_DATE_EPOCH="$source_date_epoch"
            UV_NO_CACHE=1
            /usr/bin/unshare --net --
            /usr/bin/setpriv
            --reuid="$runner_uid"
            --regid=nogroup
            --clear-groups
            --no-new-privs
          )
          mkdir --parents \
            "$RC_ROOT/build-a" \
            "$RC_ROOT/build-b" \
            "$RC_BUNDLE/dist"
          cd "$SOURCE_ROOT"
          for output in "$RC_ROOT/build-a" "$RC_ROOT/build-b"; do
            "${run_isolated[@]}" "$python_path" -m hatchling build \
              --target wheel \
              --target sdist \
              --directory "$output"
          done
          rm --force -- "$RC_ROOT/build-a/.gitignore" "$RC_ROOT/build-b/.gitignore"
          test "$(find "$RC_ROOT/build-a" -maxdepth 1 -type f | wc -l)" = 2
          test "$(find "$RC_ROOT/build-b" -maxdepth 1 -type f | wc -l)" = 2
          for subject in \
            evidencemesh-0.1.0-py3-none-any.whl \
            evidencemesh-0.1.0.tar.gz; do
            cmp "$RC_ROOT/build-a/$subject" "$RC_ROOT/build-b/$subject"
            cp -- "$RC_ROOT/build-a/$subject" "$RC_BUNDLE/dist/$subject"
          done
          uvx twine==7.0.0 check "$RC_BUNDLE"/dist/*

      - name: Install and exercise both distributions offline
        shell: bash
        run: |
          set -euo pipefail
          runner_uid=$(id -u)
          isolated_root="$RC_ROOT/isolated"
          uv_path=$(command -v uv)
          run_isolated=(
            sudo env -i
            HOME="$isolated_root"
            TMPDIR="$isolated_root"
            PATH=/usr/bin:/bin
            PYTHONDONTWRITEBYTECODE=1
            UV_NO_CACHE=1
            /usr/bin/unshare --net --
            /usr/bin/setpriv
            --reuid="$runner_uid"
            --regid=nogroup
            --clear-groups
            --no-new-privs
          )
          "${run_isolated[@]}" "$uv_path" pip install \
            --python "$RC_ROOT/wheel-installed/bin/python" \
            --no-deps \
            "$RC_BUNDLE/dist/evidencemesh-0.1.0-py3-none-any.whl"
          "${run_isolated[@]}" "$uv_path" pip install \
            --python "$RC_ROOT/sdist-installed/bin/python" \
            --no-deps \
            --no-build-isolation \
            "$RC_BUNDLE/dist/evidencemesh-0.1.0.tar.gz"
          "${run_isolated[@]}" "$uv_path" pip check \
            --python "$RC_ROOT/wheel-installed/bin/python"
          "${run_isolated[@]}" "$uv_path" pip check \
            --python "$RC_ROOT/sdist-installed/bin/python"
          cd "$RC_ROOT"
          "${run_isolated[@]}" "$RC_ROOT/wheel-installed/bin/python" -I \
            "$SOURCE_ROOT/scripts/smoke_installed_rc3.py" \
            --label wheel \
            --cli-command "$RC_ROOT/wheel-installed/bin/evidencemesh" \
            --mcp-command "$RC_ROOT/wheel-installed/bin/evidencemesh-mcp" \
            --distribution "$RC_BUNDLE/dist/evidencemesh-0.1.0-py3-none-any.whl" \
            --work-root "$RC_ROOT/wheel-smoke-private" \
            --output "$RC_BUNDLE/installed-wheel-rc3-smoke.json"
          "${run_isolated[@]}" "$RC_ROOT/sdist-installed/bin/python" -I \
            "$SOURCE_ROOT/scripts/smoke_installed_rc3.py" \
            --label sdist \
            --cli-command "$RC_ROOT/sdist-installed/bin/evidencemesh" \
            --mcp-command "$RC_ROOT/sdist-installed/bin/evidencemesh-mcp" \
            --distribution "$RC_BUNDLE/dist/evidencemesh-0.1.0.tar.gz" \
            --work-root "$RC_ROOT/sdist-smoke-private" \
            --output "$RC_BUNDLE/installed-sdist-rc3-smoke.json"
          "${run_isolated[@]}" "$RC_ROOT/wheel-installed/bin/evidencemesh" \
            benchmark-offline \
            > "$RC_BUNDLE/installed-wheel-offline-benchmark.json"

      - name: Generate CycloneDX and close the ephemeral bundle
        shell: bash
        run: |
          set -euo pipefail
          uvx --from cyclonedx-bom==7.3.0 cyclonedx-py environment \
            "$RC_ROOT/wheel-installed/bin/python" \
            --pyproject "$SOURCE_ROOT/pyproject.toml" \
            --mc-type application \
            --spec-version 1.7 \
            --output-format JSON \
            --output-file "$RC_BUNDLE/evidencemesh-0.1.0.cdx.json"
          candidate_tree=$(git -C "$GITHUB_WORKSPACE" rev-parse \
            "$EXPECTED_SHA^{tree}")
          workflow_sha256=$(sha256sum \
            "$SOURCE_ROOT/.github/workflows/alpha-rc3-head-exact.yml" \
            | cut -d' ' -f1)
          sudo env -i \
            HOME="$RC_ROOT/isolated" \
            TMPDIR="$RC_ROOT/isolated" \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/unshare --net -- \
            /usr/bin/setpriv \
            --reuid="$(id -u)" \
            --regid=nogroup \
            --clear-groups \
            --no-new-privs \
            "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$SOURCE_ROOT/scripts/build_alpha_rc3_head_bundle.py" \
            --bundle-dir "$RC_BUNDLE" \
            --source-root "$SOURCE_ROOT" \
            --protocol-sha256 "$PROTOCOL_SHA256" \
            --workflow-sha256 "$workflow_sha256" \
            --candidate-sha "$EXPECTED_SHA" \
            --candidate-tree "$candidate_tree" \
            --runtime-base-sha "$RUNTIME_BASE_SHA" \
            --runtime-base-tree "$RUNTIME_BASE_TREE"
          cd "$RC_BUNDLE"
          sha256sum --check SHA256SUMS
          cd "$SOURCE_ROOT"
          sha256sum --check "$SOURCE_SUMS"
          test -z "$(git -C "$GITHUB_WORKSPACE" status \
            --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE" diff-index --quiet "$EXPECTED_SHA" --

      - name: Recheck draft identity immediately before attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          observed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/1" \
            --jq '[.state, (.draft | tostring), .head.sha] | @tsv')
          expected=$(printf 'open\ttrue\t%s' "$EXPECTED_SHA")
          test "$observed" = "$expected"

      - name: Attest every checksummed ephemeral subject
        id: provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ env.RC_BUNDLE }}/SHA256SUMS

      - name: Attest the wheel CycloneDX SBOM
        id: sbom
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ env.RC_BUNDLE }}/dist/evidencemesh-0.1.0-py3-none-any.whl
          sbom-path: ${{ env.RC_BUNDLE }}/evidencemesh-0.1.0.cdx.json

      - name: Verify candidate provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: VynoDePal/EvidenceMesh/.github/workflows/alpha-rc3-head-exact.yml
        shell: bash
        run: |
          set -euo pipefail
          while read -r _ subject; do
            subject="${subject#\*}"
            gh attestation verify "$RC_BUNDLE/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$EXPECTED_SHA" \
              --source-ref "$GITHUB_REF" \
              --signer-digest "$EXPECTED_SHA" \
              --deny-self-hosted-runners
          done < "$RC_BUNDLE/SHA256SUMS"
          gh attestation verify \
            "$RC_BUNDLE/dist/evidencemesh-0.1.0-py3-none-any.whl" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-digest "$EXPECTED_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-digest "$EXPECTED_SHA" \
            --deny-self-hosted-runners \
            --predicate-type https://cyclonedx.org/bom

      - name: Finalize the public metadata-only result
        env:
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_ID: ${{ steps.sbom.outputs.attestation-id }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree=$(git -C "$GITHUB_WORKSPACE" rev-parse \
            "$EXPECTED_SHA^{tree}")
          sudo env -i \
            HOME="$RC_ROOT/isolated" \
            TMPDIR="$RC_ROOT/isolated" \
            PATH=/usr/bin:/bin \
            PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/unshare --net -- \
            /usr/bin/setpriv \
            --reuid="$(id -u)" \
            --regid=nogroup \
            --clear-groups \
            --no-new-privs \
            "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$SOURCE_ROOT/scripts/finalize_alpha_rc3_head_report.py" \
            --bundle-dir "$RC_BUNDLE" \
            --output "$RESULT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-sha "$EXPECTED_SHA" \
            --candidate-tree "$candidate_tree" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --provenance-attestation-id "$PROVENANCE_ID" \
            --provenance-attestation-url "$PROVENANCE_URL" \
            --sbom-attestation-id "$SBOM_ID" \
            --sbom-attestation-url "$SBOM_URL"

      - name: Attest the metadata-only result
        id: result-attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ env.RESULT_PATH }}

      - name: Verify result attestation and emit the seal record
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          RESULT_ID: ${{ steps.result-attestation.outputs.attestation-id }}
          RESULT_URL: ${{ steps.result-attestation.outputs.attestation-url }}
          SBOM_ID: ${{ steps.sbom.outputs.attestation-id }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
          SIGNER_WORKFLOW: VynoDePal/EvidenceMesh/.github/workflows/alpha-rc3-head-exact.yml
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "$RESULT_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-digest "$EXPECTED_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-digest "$EXPECTED_SHA" \
            --deny-self-hosted-runners
          observed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/1" \
            --jq '[.state, (.draft | tostring), .head.sha] | @tsv')
          expected=$(printf 'open\ttrue\t%s' "$EXPECTED_SHA")
          test "$observed" = "$expected"
          echo 'ALPHA_RC3_SEAL_RECORD_BEGIN'
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RESULT_PATH"])
          report = json.loads(report_path.read_bytes())
          record = {
              "schema_version": 1,
              "candidate": report["candidate"],
              "decision": report["decision"],
              "distribution": report["distribution"],
              "environment": report["environment"],
              "protocol": report["protocol"],
              "workflow": report["workflow"],
              "report_sha256": hashlib.sha256(report_path.read_bytes()).hexdigest(),
              "attestations": {
                  "provenance": {
                      "id": int(os.environ["PROVENANCE_ID"]),
                      "url": os.environ["PROVENANCE_URL"],
                  },
                  "sbom": {
                      "id": int(os.environ["SBOM_ID"]),
                      "url": os.environ["SBOM_URL"],
                  },
                  "result": {
                      "id": int(os.environ["RESULT_ID"]),
                      "url": os.environ["RESULT_URL"],
                  },
              },
              "traffic": report["traffic"],
          }
          print(json.dumps(record, sort_keys=True, separators=(",", ":")))
          PY
          echo 'ALPHA_RC3_SEAL_RECORD_END'
          {
            echo '## EvidenceMesh Alpha-RC3 HEAD exact'
            echo
            echo "- Candidate: \`$RC_NAME\`"
            echo "- Commit: \`$EXPECTED_SHA\`"
            echo '- Installed wheel and sdist Governor: `pass`'
            echo '- Provider/model/tester requests: `0`'
            echo '- Binary artifact uploaded: `false`'
            echo '- Public metadata only: `true`'
            echo '- Live, merge and release: `blocked`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove every ephemeral candidate byte
        if: always()
        shell: bash
        run: |
          sudo rm --recursive --force -- "$RC_ROOT"
          sudo rm --recursive --force -- "$SOURCE_ROOT"
          sudo rm --force -- "$SOURCE_SUMS"
          sudo rm --force -- "$RESULT_PATH"

      - name: Confirm ephemeral output removal
        if: always()
        shell: bash
        run: |
          test ! -e "$RC_ROOT"
          test ! -e "$SOURCE_ROOT"
          test ! -e "$SOURCE_SUMS"
          test ! -e "$RESULT_PATH"
