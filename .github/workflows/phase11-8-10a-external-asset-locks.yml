name: Phase 11.8.10A External Asset Locks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/phase11-8-10a-external-asset-locks.yml
      - benchmarks/data/phase11_8_10a_asset_locks_v1.json
      - benchmarks/data/phase11_8_10a_object_inventory_v1.json
      - benchmarks/data/phase11_8_10a_source_locks_v1.json
      - benchmarks/phase11_8_10a_asset_preflight.py
      - benchmarks/run_phase11_8_10a_asset_preflight.py
      - benchmarks/results/phase11_8_10a_asset_reconnaissance_2026-07-31.json
      - benchmarks/results/phase11_8_10a_asset_reconnaissance_2026-07-31.md
      - docs/benchmark-protocol-v26.md
      - tests/test_phase11_8_10a_asset_preflight.py
      - tests/test_phase11_8_10a_runner.py
      - tests/test_phase11_8_10a_result.py
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-8-10a-external-asset-locks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata-only-asset-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked test environment
        run: |
          uv python install 3.11
          uv sync --extra dev --locked --python 3.11

      - name: Reproduce metadata-only aggregate twice
        env:
          LOCK_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run python -m benchmarks.run_phase11_8_10a_asset_preflight \
            --methodology-commit-sha "$LOCK_COMMIT_SHA" \
            --output /tmp/phase11_8_10a_a.json
          uv run python -m benchmarks.run_phase11_8_10a_asset_preflight \
            --methodology-commit-sha "$LOCK_COMMIT_SHA" \
            --output /tmp/phase11_8_10a_b.json
          cmp /tmp/phase11_8_10a_a.json /tmp/phase11_8_10a_b.json

      - name: Run focused tests and static checks
        run: |
          result_test=()
          if [[ -f tests/test_phase11_8_10a_result.py ]]; then
            result_test=(tests/test_phase11_8_10a_result.py)
          fi
          uv run pytest \
            tests/test_phase11_8_10a_asset_preflight.py \
            tests/test_phase11_8_10a_runner.py \
            "${result_test[@]}" \
            -q
          uv run ruff check \
            benchmarks/phase11_8_10a_asset_preflight.py \
            benchmarks/run_phase11_8_10a_asset_preflight.py \
            tests/test_phase11_8_10a_asset_preflight.py \
            tests/test_phase11_8_10a_runner.py \
            "${result_test[@]}"
          uv run ruff format --check \
            benchmarks/phase11_8_10a_asset_preflight.py \
            benchmarks/run_phase11_8_10a_asset_preflight.py \
            tests/test_phase11_8_10a_asset_preflight.py \
            tests/test_phase11_8_10a_runner.py \
            "${result_test[@]}"
