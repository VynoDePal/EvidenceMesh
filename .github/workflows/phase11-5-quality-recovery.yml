name: Phase 11.5 Quality Recovery

on:
  pull_request:
    paths:
      - .github/workflows/phase11-5-quality-recovery.yml
      - benchmarks/data/end_to_end_phase10_v1.json
      - benchmarks/run_phase11_5_quality_recovery.py
      - benchmarks/results/phase11_5_quality_recovery_2026-07-29.json
      - docker/searxng/phase11-community-settings.yml
      - docs/benchmark-protocol-v13.md
      - src/evidencemesh/citations.py
      - src/evidencemesh/mcp_server.py
      - tests/test_phase11_5_quality_recovery.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-5-quality-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  SEARXNG_IMAGE: searxng/searxng:2026.7.26-b060c780d@sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516
  DATASET_PATH: /tmp/simple_qa_test_set_phase11_5.csv
  RESULT_PATH: /tmp/phase11_5_quality_recovery_2026-07-29.json
  CACHE_ROOT: /tmp/evidencemesh-phase11-5-cache

jobs:
  quality-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Detect an already committed result
        id: benchmark-state
        shell: bash
        run: |
          if [[ -f benchmarks/results/phase11_5_quality_recovery_2026-07-29.json ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: steps.benchmark-state.outputs.run == 'true'
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install locked benchmark environment
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          uv python install 3.11
          uv sync --extra dev --locked --python 3.11

      - name: Verify protocol-locked inputs
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          echo \
            "7fa9f6a0e40d2c7e18260de6468fa1b86770752f1b366985a2bedc5b070155b6  docs/benchmark-protocol-v13.md" \
            | sha256sum --check
          echo \
            "b38b89d316219be7dbd249f4365e0801330eb469ff6cc9b4fdaffebe6510134f  benchmarks/data/end_to_end_phase10_v1.json" \
            | sha256sum --check
          echo \
            "e33610cdd83c89a0fb85e687e632b179ed36057d948db102c7a6e2c33b456efb  docker/searxng/phase11-community-settings.yml" \
            | sha256sum --check

      - name: Verify benchmark credentials are available
        if: steps.benchmark-state.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.EVIDENCE_MESH_GEMINI_KEY }}
          TAVILY_API_KEY: ${{ secrets.EVIDENCE_MESH_TAVILY_KEY }}
        run: |
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::EVIDENCE_MESH_GEMINI_KEY is not configured"
            exit 1
          fi
          if [[ -z "${TAVILY_API_KEY:-}" ]]; then
            echo "::error::EVIDENCE_MESH_TAVILY_KEY is not configured"
            exit 1
          fi

      - name: Download checksum-pinned SimpleQA
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --output "$DATASET_PATH" \
            https://openaipublic.blob.core.windows.net/simple-evals/simple_qa_test_set.csv
          echo \
            "feee3f7e7db3617e94e8fcf1977b756ec420ef8568f4e0fcbbe0e92e9d5fc032  $DATASET_PATH" \
            | sha256sum --check

      - name: Start checksum-pinned community SearXNG
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          docker run --detach \
            --name evidencemesh-searxng-phase11-5 \
            --publish 127.0.0.1:8897:8080 \
            --volume \
              "$GITHUB_WORKSPACE/docker/searxng/phase11-community-settings.yml:/etc/searxng/settings.yml:ro" \
            --env SEARXNG_BASE_URL=http://localhost:8897/ \
            --env "SEARXNG_SECRET=$(openssl rand -hex 32)" \
            --env FORCE_OWNERSHIP=false \
            "$SEARXNG_IMAGE"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8897/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs evidencemesh-searxng-phase11-5
          exit 1

      - name: Verify SearXNG image digest
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          docker image inspect "$SEARXNG_IMAGE" --format '{{json .RepoDigests}}' |
            grep --fixed-strings \
              "sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516"

      - name: Run locked 12-case three-arm quality recovery
        if: steps.benchmark-state.outputs.run == 'true'
        env:
          EVIDENCEMESH_BENCHMARK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GEMINI_API_KEY: ${{ secrets.EVIDENCE_MESH_GEMINI_KEY }}
          TAVILY_API_KEY: ${{ secrets.EVIDENCE_MESH_TAVILY_KEY }}
        run: |
          uv run python benchmarks/run_phase11_5_quality_recovery.py \
            --dataset "$DATASET_PATH" \
            --manifest benchmarks/data/end_to_end_phase10_v1.json \
            --excluded-sample-result \
              benchmarks/results/simpleqa_retrieval_phase3_2026-07-28.json \
            --searxng-config docker/searxng/phase11-community-settings.yml \
            --models \
              gemma-4-31b-it \
              gemma-4-26b-a4b-it \
              gemini-3.5-flash-lite \
            --searxng-url http://127.0.0.1:8897 \
            --cache-root "$CACHE_ROOT" \
            --max-results 10 \
            --max-per-domain 3 \
            --evidence-budget-chars 12000 \
            --candidate-max-block-chars 900 \
            --max-output-tokens 2048 \
            --retrieval-wall-time-seconds 90 \
            --generation-wall-time-seconds 120 \
            --retrieval-pause-seconds 0.5 \
            --model-pause-seconds 2.0 \
            --request-timeout-seconds 20 \
            --network-region "${EVIDENCEMESH_BENCHMARK_REGION:-GitHub-hosted runner}" \
            --output "$RESULT_PATH" \
            --progress

      - name: Validate privacy, accounting and decision boundaries
        if: steps.benchmark-state.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.EVIDENCE_MESH_GEMINI_KEY }}
          TAVILY_API_KEY: ${{ secrets.EVIDENCE_MESH_TAVILY_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          path = Path(os.environ["RESULT_PATH"])
          report = json.loads(path.read_bytes())
          assert report["benchmark"] == "evidencemesh-phase11-5-quality-recovery-v1"
          assert report["suite"]["sample_count"] == 12
          assert report["suite"]["phase12_cases_used"] is False
          assert report["protocol"]["models"] == [
              "gemma-4-31b-it",
              "gemma-4-26b-a4b-it",
              "gemini-3.5-flash-lite",
          ]
          assert report["protocol"]["generation_arms"] == [
              "tavily_direct",
              "quality_current_8_2",
              "quality_candidate",
          ]
          assert report["protocol"]["shared_raw_pool_per_case"] is True
          assert report["protocol"]["community_track_blocking"] is False

          traffic = report["traffic"]
          assert traffic["case_retrieval_operations"] == 12
          assert traffic["generation_requests"] == 108
          assert traffic["expected_generation_requests"] == 108
          assert traffic["tavily_requests"] == 12
          assert traffic["maximum_tavily_requests"] == 12
          assert traffic["retries"] == 0
          assert traffic["repair_requests"] == 0
          assert len(report["retrieval_outcomes"]) == 48
          assert len(report["generation_outcomes"]) == 108

          prompt_groups = defaultdict(set)
          for outcome in report["generation_outcomes"]:
              key = (outcome["case_id"], outcome["arm"])
              prompt_groups[key].add(
                  (
                      outcome["prompt_sha256"],
                      outcome["prompt_evidence_count"],
                      outcome["prompt_tavily_evidence_count"],
                  )
              )
          assert len(prompt_groups) == 36
          assert all(len(values) == 1 for values in prompt_groups.values())

          selected = defaultdict(dict)
          for outcome in report["retrieval_outcomes"]:
              selected[outcome["case_id"]][outcome["arm"]] = outcome
          assert all(
              arms["quality_current_8_2"]["selected_packet_sha256"]
              == arms["quality_candidate"]["selected_packet_sha256"]
              for arms in selected.values()
          )

          decision = report["decision"]
          assert decision["phase12_untouched_evaluation_allowed"] == (
              decision["phase11_5_candidate_passed"]
          )
          assert decision["phase12_executed"] is False
          assert decision["community_observability_blocking"] is False
          assert decision["external_competitor_benchmark_allowed"] is False
          assert decision["public_alpha_allowed"] is False
          assert decision["superiority_claim_allowed"] is False
          assert decision["merge_allowed"] is False
          assert decision["release_ready"] is False
          assert decision["release_decision"] == "no-go"

          private_fields = {
              "question",
              "answer",
              "reference_answer",
              "title",
              "url",
              "snippet",
              "content",
              "evidence",
              "system_prompt",
              "user_prompt",
              "generated_answer",
          }
          assert all(
              not private_fields & set(outcome)
              for outcome in report["retrieval_outcomes"]
          )
          assert all(
              not private_fields & set(outcome)
              for outcome in report["generation_outcomes"]
          )
          assert report["privacy"]["generated_answers_in_report"] is False
          assert report["privacy"]["source_snippets_or_evidence_in_report"] is False
          assert report["privacy"]["system_or_user_prompts_in_report"] is False

          raw = path.read_text(encoding="utf-8")
          for name in ("GEMINI_API_KEY", "TAVILY_API_KEY"):
              secret = os.environ.get(name)
              assert secret and secret not in raw
          PY

      - name: Write benchmark summary
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RESULT_PATH"])
          raw = path.read_bytes()
          report = json.loads(raw)
          retrieval = report["retrieval_metrics"]
          generated = report["generation_metrics"]["aggregate"]
          candidate = report["decision"]["phase11_5_candidate_passed"]
          print("## Phase 11.5 quality recovery")
          print()
          print("| Arm | Prompt answer-key proxy | Generated answer-key proxy | Citation presence | Support proxy |")
          print("|---|---:|---:|---:|---:|")
          for arm in ("tavily_direct", "quality_current_8_2", "quality_candidate"):
              print(
                  f"| `{arm}` | "
                  f"{retrieval[arm]['answer_key_in_prompt_evidence']['numerator']}/12 | "
                  f"{generated[arm]['answer_key_covered']['numerator']}/36 | "
                  f"{generated[arm]['citation_presence']['rate']} | "
                  f"{generated[arm]['citation_support_proxy']['rate']} |"
              )
          print()
          print(f"Candidate gate: `{'pass' if candidate else 'fail'}`")
          print(
              "Phase 12 allowed: "
              f"`{report['decision']['phase12_untouched_evaluation_allowed']}`"
          )
          print("Release decision: `no-go`")
          print()
          print(f"Raw SHA-256: `{hashlib.sha256(raw).hexdigest()}`")
          PY

      - name: Show SearXNG logs on failure
        if: failure() && steps.benchmark-state.outputs.run == 'true'
        run: docker logs evidencemesh-searxng-phase11-5

      - name: Stop SearXNG
        if: always() && steps.benchmark-state.outputs.run == 'true'
        run: docker rm --force evidencemesh-searxng-phase11-5

      - name: Upload privacy-safe raw report
        if: always() && steps.benchmark-state.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase11-5-quality-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: warn
          retention-days: 14
