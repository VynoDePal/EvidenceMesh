name: Phase 11.2 Independent Index

on:
  pull_request:
    paths:
      - .github/workflows/phase11-2-independent-index.yml
      - benchmarks/data/independent_index_calibration_v1.json
      - benchmarks/run_phase11_2_independent_index.py
      - benchmarks/results/phase11_2_independent_index_2026-07-29.json
      - docker/searxng/phase11-community-settings.yml
      - docs/benchmark-protocol-v11.md
      - docs/independent-index-assessment-v1.md
      - docs/providers.md
      - src/evidencemesh/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-2-independent-index-${{ github.ref }}
  cancel-in-progress: true

env:
  SEARXNG_IMAGE: searxng/searxng:2026.7.26-b060c780d@sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516
  RESULT_PATH: /tmp/phase11_2_independent_index_2026-07-29.json
  CACHE_ROOT: /tmp/evidencemesh-phase11-2-cache

jobs:
  independent-index-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect an already committed result
        id: benchmark-state
        shell: bash
        run: |
          if [[ -f benchmarks/results/phase11_2_independent_index_2026-07-29.json ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: steps.benchmark-state.outputs.run == 'true'
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install benchmark environment
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          uv python install 3.11
          uv sync --extra dev --locked --python 3.11

      - name: Verify protocol-locked inputs
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          echo \
            "670454d6c6bdb93a21bc1ea81f28003e08cac9d24c1663aba53fea50d3ac2423  benchmarks/data/independent_index_calibration_v1.json" \
            | sha256sum --check
          echo \
            "e33610cdd83c89a0fb85e687e632b179ed36057d948db102c7a6e2c33b456efb  docker/searxng/phase11-community-settings.yml" \
            | sha256sum --check

      - name: Start checksum-pinned multi-engine SearXNG
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          docker run --detach \
            --name evidencemesh-searxng-phase11-2 \
            --publish 127.0.0.1:8896:8080 \
            --volume \
              "$GITHUB_WORKSPACE/docker/searxng/phase11-community-settings.yml:/etc/searxng/settings.yml:ro" \
            --env SEARXNG_BASE_URL=http://localhost:8896/ \
            --env "SEARXNG_SECRET=$(openssl rand -hex 32)" \
            --env FORCE_OWNERSHIP=false \
            "$SEARXNG_IMAGE"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8896/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs evidencemesh-searxng-phase11-2
          exit 1

      - name: Verify SearXNG image digest
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          docker image inspect "$SEARXNG_IMAGE" --format '{{json .RepoDigests}}' |
            grep --fixed-strings \
              "sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516"

      - name: Run locked shared-pool calibration
        if: steps.benchmark-state.outputs.run == 'true'
        env:
          EVIDENCEMESH_BENCHMARK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run python benchmarks/run_phase11_2_independent_index.py \
            --suite benchmarks/data/independent_index_calibration_v1.json \
            --searxng-config docker/searxng/phase11-community-settings.yml \
            --searxng-url http://127.0.0.1:8896 \
            --wiby-url https://wiby.me/json/ \
            --mwmbl-url https://api.mwmbl.org/api/v2/search/ \
            --cache-root "$CACHE_ROOT" \
            --max-results 10 \
            --max-per-domain 3 \
            --prompt-budget-chars 12000 \
            --request-timeout-seconds 25 \
            --wall-time-seconds 75 \
            --pause-seconds 1.1 \
            --network-region "GitHub-hosted ubuntu-latest; physical region not exposed" \
            --progress \
            --output "$RESULT_PATH"

      - name: Validate lineage, privacy, traffic and release boundary
        if: steps.benchmark-state.outputs.run == 'true'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RESULT_PATH"]).read_bytes())
          outcomes = report["outcomes"]
          arms = {
              "legacy_community",
              "candidate_community",
              "mwmbl_direct",
              "wiby_direct",
              "independent_fused",
          }
          providers = {"searxng", "ddgs", "wikipedia", "wiby", "mwmbl"}
          forbidden = {
              "query",
              "question",
              "target_domains",
              "title",
              "url",
              "snippet",
              "content",
              "evidence",
          }
          required_stages = {
              "raw",
              "fused",
              "eligible",
              "selected",
              "evidence",
              "prompt",
          }
          diagnostics = report["retrieval_diagnostics"]
          expected = (
              report["schema_version"] == 1
              and report["benchmark"]
                  == "evidencemesh-phase11-2-independent-index-calibration-v1"
              and report["suite"]["sha256"]
                  == "670454d6c6bdb93a21bc1ea81f28003e08cac9d24c1663aba53fea50d3ac2423"
              and report["suite"]["case_count"] == 16
              and report["suite"]["stratum_distribution"]
                  == {"broad_web": 8, "long_tail": 8}
              and report["suite"]["exploratory_query_excluded"] is True
              and report["protocol"]["searxng_config_sha256"]
                  == "e33610cdd83c89a0fb85e687e632b179ed36057d948db102c7a6e2c33b456efb"
              and set(report["protocol"]["arms"]) == arms
              and set(report["protocol"]["live_providers"]) == providers
              and report["protocol"]["shared_raw_pool_per_case"] is True
              and report["protocol"]["provider_calls_replayed"] is False
              and report["protocol"]["provider_specific_ranking_boost"] is False
              and report["protocol"]["provider_reservation"] is False
              and report["protocol"]["mwmbl"]["result_license_url"]
                  == "https://creativecommons.org/licenses/by-nc-sa/4.0/"
              and report["protocol"]["mwmbl"]["default_enabled"] is False
              and report["protocol"]["yacy"]["broad_index_benchmarked"] is False
              and report["environment"]["commit_sha"] == os.environ["EXPECTED_SHA"]
              and report["traffic"]["case_retrieval_operations"] == 16
              and report["traffic"]["provider_query_calls"] == 80
              and report["traffic"]["mwmbl_requests"] == 16
              and report["traffic"]["wiby_requests"] == 16
              and report["traffic"]["paid_provider_requests"] == 0
              and report["traffic"]["tavily_requests"] == 0
              and report["traffic"]["gemini_requests"] == 0
              and report["traffic"]["retries"] == 0
              and len(diagnostics) == 16
              and all(
                  set(item["provider_query_counts"]) == providers
                  and set(item["provider_query_counts"].values()) == {1}
                  for item in diagnostics
              )
              and len(outcomes) == 80
              and {outcome["arm"] for outcome in outcomes} == arms
              and all(not forbidden & set(outcome) for outcome in outcomes)
              and all(
                  set(outcome["provider_stage_counts"]) == required_stages
                  for outcome in outcomes
              )
              and all(
                  outcome["ranking_reservation_policy"] == "none"
                  and outcome["ranking_reservation_requested"] == 0
                  for outcome in outcomes
              )
              and report["privacy"]["queries_in_report"] is False
              and report["privacy"]["target_domains_in_report"] is False
              and report["privacy"]["source_titles_or_urls_in_report"] is False
              and report["privacy"]["source_snippets_in_report"] is False
              and report["decision"]["default_bundle_eligible"] is False
              and report["decision"]["phase12_untouched_evaluation_allowed"] is False
              and report["decision"]["stage_b_external_agents_allowed"] is False
              and report["decision"]["release_ready"] is False
              and report["decision"]["release_decision"] == "no-go"
          )
          if not expected:
              raise AssertionError(
                  "Phase 11.2 report failed a locked lineage, privacy, "
                  "traffic, licensing, or release invariant"
              )
          PY

      - name: Write calibration summary
        if: steps.benchmark-state.outputs.run == 'true'
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["RESULT_PATH"]).read_bytes())
          print("## Phase 11.2 independent-index calibration")
          print()
          print("| Arm | Availability | Target hit@10 | Mwmbl selected cases |")
          print("|---|---:|---:|---:|")
          for arm, values in report["metrics"].items():
              availability = values["availability"]
              target = values["target_domain_hit_at_10"]
              selected = values["cases_with_selected_mwmbl"]
              print(
                  f"| {arm} | {availability['numerator']}/{availability['denominator']} "
                  f"| {target['numerator']}/{target['denominator']} "
                  f"| {selected['numerator']}/{selected['denominator']} |"
              )
          print()
          print(
              "Retrieval gates passed: "
              f"`{report['decision']['retrieval_candidate_passed']}`."
          )
          print("Default promotion and release remain `no-go`; no paid API or model was used.")
          PY

      - name: Upload privacy-safe Phase 11.2 result
        if: steps.benchmark-state.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase11-2-independent-index-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.RESULT_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Stop SearXNG
        if: always() && steps.benchmark-state.outputs.run == 'true'
        run: docker rm --force evidencemesh-searxng-phase11-2 || true
