name: Feature request
description: Propose a provider, retrieval feature or evaluation.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which research or retrieval gap should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Describe inputs, outputs, failure modes and provider costs or quotas.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation
      description: How can this be tested without relying on a marketing claim?
    validations:
      required: true
