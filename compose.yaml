services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/
      interval: 15s
      timeout: 5s
      retries: 10

  evidencemesh:
    build: .
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      EVIDENCEMESH_SEARXNG_URL: http://searxng:8080
      EVIDENCEMESH_CACHE_PATH: /data/cache.sqlite3
    volumes:
      - evidencemesh-data:/data
    command:
      - serve
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8000"

volumes:
  evidencemesh-data:
