services:
  searxng:
    image: searxng/searxng:2026.7.26-b060c780d@sha256:d0aaeb14880e6e92bde1518fcc7261e995783367d63d95203383607bef9c6516
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      FORCE_OWNERSHIP: "false"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/
      interval: 15s
      timeout: 5s
      retries: 10

  yacy:
    image: yacy/yacy_search_server:latest@sha256:a4672379f0824f4611e29d1c1dbd7eb26eac1011d1f1962dcffb83c099f5d278
    profiles:
      - independent-index
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - yacy-data:/opt/yacy_search_server/DATA
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  evidencemesh:
    build: .
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      EVIDENCEMESH_SEARXNG_URL: http://searxng:8080
      EVIDENCEMESH_YACY_URL: http://yacy:8090
      EVIDENCEMESH_CACHE_PATH: /data/cache.sqlite3
    volumes:
      - evidencemesh-data:/data
    command:
      - serve
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8000"

volumes:
  evidencemesh-data:
  yacy-data:
