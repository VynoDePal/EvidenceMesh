use_default_settings:
  engines:
    keep_only:
      - brave
      - brave.news
      - duckduckgo
      - duckduckgo news
      - startpage
      - startpage news
      - wikipedia
      - wikinews

general:
  debug: false
  instance_name: EvidenceMesh Phase 11 community calibration

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 30
  pool_maxsize: 15
  enable_http2: true
