use_default_settings:
  engines:
    keep_only:
      - brave
      - duckduckgo
      - mojeek
      - mwmbl
      - qwant
      - startpage
      - wiby
      - yep

general:
  debug: false
  instance_name: EvidenceMesh engine calibration

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: true

engines:
  - name: mojeek
    disabled: false
  - name: mwmbl
    disabled: false
  - name: qwant
    disabled: false
  - name: wiby
    disabled: false
  - name: yep
    disabled: false
